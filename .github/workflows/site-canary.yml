name: eDealinfo layout canary

# Parses a few of today's live deals to catch changes to eDealinfo's markup.
# Network-dependent, so it runs on a schedule rather than on every push.
on:
  schedule:
    - cron: '17 14 * * 1' # Mondays, 14:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run canary
